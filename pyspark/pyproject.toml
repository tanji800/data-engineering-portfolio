[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspark-advanced-engineering"
version = "0.1.0"
description = "Advanced PySpark portfolio examples using synthetic e-commerce data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5,<3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
